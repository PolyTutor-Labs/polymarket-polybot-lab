# Educational quality gates only.
# Read-only. No publication, no live trading, no write permissions.
name: quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: compile, tests, secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install paper-lab dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Syntax compile
        run: python -m compileall -q -x '\.git' .

      - name: Tests
        run: python -m pytest tests/ -q

      - name: Secret scan
        run: python scripts/security/check_secrets.py

      - name: Internal markdown links
        run: python scripts/quality/check.py links
